<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Enycosmic MetaCamAR</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.78);
      color: #ffffff;
      z-index: 9999;
      font-size: 12px;
      line-height: 1.45;
      max-width: 300px;

      font-family: "Courier New", monospace;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;

      border: 3px solid #ffffff;
      border-radius: 0;
      box-shadow:
        4px 4px 0 #000,
        0 0 0 2px #000 inset;

      image-rendering: pixelated;
      text-rendering: geometricPrecision;
      pointer-events: none;
    }

    #enycosmic-logo {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 44px;
      height: auto;
      z-index: 10000;
      pointer-events: none;
      image-rendering: auto;
    }

#ar-canvas {
  position: fixed !important;
  z-index: 2 !important;
  pointer-events: none !important;
  display: block !important;
  /* El tamaño y la posición se calculan desde JS para conservar
     exactamente la misma relación de aspecto que el video. */
}

video,
#arjs-video {
  position: fixed !important;
  z-index: 1 !important;
  margin: 0 !important;
  padding: 0 !important;
  object-fit: fill !important;
  /* JS aplica un recorte tipo cover usando dimensiones reales,
     sin estirar ni el video ni la capa WebGL. */
}

body > canvas:not(#ar-canvas) {
  display: none !important;
}
  </style>
</head>

<body>
  <img
    id="enycosmic-logo"
    src="https://enycosmicplayer.vercel.app/assets/src/logo.png"
    alt="Enycosmic Logo"
  />

  <div id="info">
    Apunta la Metacámara hacia una tarjeta de especialidad.
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <!-- GLTF / GLB Loader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex.js"></script>

  <script src="./script.js"></script>
</body>
</html>
