<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Enycosmic MetaCamAR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      z-index: 10;
      font-size: 13px;
      line-height: 1.35;
      max-width: 280px;
    }

    canvas, video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <div id="info">
    Apunta la Metacámara hacia una tarjeta de especialidad.
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <!-- GLTF / GLB Loader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex.js"></script>

  <script>
    let scene;
    let camera;
    let renderer;
    let arToolkitSource;
    let arToolkitContext;

    const tarjetasEspecialidad = [
      {
        id: "ec1",
        nombre: "Tarjeta EC1",
        patternUrl: "./src/tarjetaEc1.patt",
        glbUrl: "./src/ec1.glb",
        scale: 0.45,
        y: 0.05
      },
      {
        id: "ec2",
        nombre: "Tarjeta EC2",
        patternUrl: "./src/tarjetaEc2.patt",
        glbUrl: "./src/ec2.glb",
        scale: 0.45,
        y: 0.05
      },
      {
        id: "ec3",
        nombre: "Tarjeta EC3",
        patternUrl: "./src/tarjetaEc3.patt",
        glbUrl: "./src/ec3.glb",
        scale: 0.45,
        y: 0.05
      }
    ];

    const markerRoots = [];

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.Camera();
      scene.add(camera);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;

      renderer.domElement.style.position = "absolute";
      renderer.domElement.style.top = "0";
      renderer.domElement.style.left = "0";

      document.body.appendChild(renderer.domElement);

      arToolkitSource = new THREEx.ArToolkitSource({
        sourceType: "webcam"
      });

      arToolkitSource.init(function () {
        onResize();
      });

      window.addEventListener("resize", onResize);

      arToolkitContext = new THREEx.ArToolkitContext({
        cameraParametersUrl: "repo/camera_para.dat",
        detectionMode: "mono"
      });

      arToolkitContext.init(function () {
        camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
      });

      crearLuces();
      crearTarjetasEspecialidad();
    }

    function crearLuces() {
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x222244, 1.25);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dirLight.position.set(1, 3, 2);
      scene.add(dirLight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);
    }

    function crearTarjetasEspecialidad() {
      const loader = new THREE.GLTFLoader();

      tarjetasEspecialidad.forEach((tarjeta) => {
        const markerRoot = new THREE.Group();
        markerRoot.name = tarjeta.id;
        markerRoot.visible = false;

        scene.add(markerRoot);
        markerRoots.push(markerRoot);

        new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
          type: "pattern",
          patternUrl: tarjeta.patternUrl
        });

        loader.load(
          tarjeta.glbUrl,
          function (gltf) {
            const model = gltf.scene;

            model.scale.set(tarjeta.scale, tarjeta.scale, tarjeta.scale);

            // AR.js usa el marcador como plano XZ.
            // Por eso Y es altura: así el modelo queda de pie sobre la tarjeta.
            model.position.set(0, tarjeta.y, 0);

            // Si el GLB aparece acostado, prueba cambiar esta línea:
            // model.rotation.x = 0;
            model.rotation.x = 0;

            prepararModelo(model);

            markerRoot.add(model);
          },
          undefined,
          function (error) {
            console.error("No se pudo cargar el modelo:", tarjeta.glbUrl, error);
          }
        );
      });
    }

    function prepararModelo(model) {
      model.traverse((child) => {
        if (!child.isMesh) return;

        child.castShadow = false;
        child.receiveShadow = false;

        if (child.material) {
          child.material.side = THREE.DoubleSide;
          child.material.needsUpdate = true;
        }
      });
    }

    function onResize() {
      if (!arToolkitSource) return;

      arToolkitSource.onResize();
      arToolkitSource.copySizeTo(renderer.domElement);

      if (
        arToolkitContext &&
        arToolkitContext.arController !== null
      ) {
        arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
      }
    }

    function update() {
      if (!arToolkitSource || arToolkitSource.ready === false) return;
      if (!arToolkitContext) return;

      arToolkitContext.update(arToolkitSource.domElement);
    }

    function render() {
      renderer.render(scene, camera);
    }

    function animate() {
      requestAnimationFrame(animate);

      update();

      markerRoots.forEach((root) => {
        if (!root.visible) return;

        root.children.forEach((child) => {
          child.rotation.y += 0.01;
        });
      });

      render();
    }
  </script>
</body>
</html>
